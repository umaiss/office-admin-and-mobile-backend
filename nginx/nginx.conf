# =============================================================================
#  nginx — reverse proxy in front of the OB Track API
# =============================================================================
#  Why put nginx in front of Node at all?
#
#    • It terminates client connections, so slow or malicious clients tie up
#      nginx rather than your single-threaded Node process.
#    • It is where TLS goes when you add a domain later.
#    • It can serve static files and rate-limit at the edge.
#    • It lets you restart the API without dropping the listening socket.
#
#  ⚠ THIS CONFIG IS PLAIN HTTP. Passwords and tokens travel unencrypted and can
#    be read by anyone on the network path. Fine for testing against an EC2 IP;
#    NOT safe for real users. See docs/DEPLOYMENT.md for the HTTPS upgrade once
#    you have a domain.
# =============================================================================

upstream obtrack_api {
    # `api` is the compose service name; Docker's internal DNS resolves it.
    server api:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Do not advertise the exact nginx version in response headers.
    server_tokens off;

    # GPS batches from the mobile app can be large. The default is 1MB, which a
    # few hundred buffered location points would exceed.
    client_max_body_size 10M;

    # Drop clients that open a connection and then send nothing — the cheapest
    # form of denial of service.
    client_body_timeout 15s;
    client_header_timeout 15s;

    location / {
        proxy_pass http://obtrack_api;
        proxy_http_version 1.1;

        # ---- The headers that make `trust proxy` work -----------------------
        # Without these, the app sees every request as coming from the nginx
        # container. Rate limiting would then count all users as one client, and
        # every audit record would show the proxy's address.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for WebSockets, which Phase 7 will add for live task updates.
        # Harmless for ordinary requests; adding it now avoids a puzzling
        # "connection fails in production but works locally" later.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Let the app decide what to compress; double-compressing wastes CPU.
        proxy_buffering off;
    }

    # Health probes, kept out of the access log so they do not drown real
    # traffic — they run every 30 seconds, forever.
    location = /health/live {
        access_log off;
        proxy_pass http://obtrack_api;
        proxy_set_header Host $host;
    }

    location = /health/ready {
        access_log off;
        proxy_pass http://obtrack_api;
        proxy_set_header Host $host;
    }
}
