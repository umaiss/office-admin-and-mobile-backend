# =============================================================================
#  OB Track — production stack for a single EC2 instance
# =============================================================================
#  Three long-running services plus one that runs and exits:
#
#    postgres  the database, with its data on a named volume so it survives
#              container restarts and redeploys
#    api       this NestJS application
#    nginx     reverse proxy on port 80, the only thing the internet talks to
#    migrate   runs `prisma migrate deploy` once, then exits
#
#  Start with:   docker compose up -d
#  Deploy with:  ./deploy.sh
# =============================================================================

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # A NAMED VOLUME. Container filesystems are disposable — everything
      # written inside a container disappears when it is replaced, which happens
      # on every deploy. Without this line, deploying would wipe your database.
      - postgres_data:/var/lib/postgresql/data
    ports:
      # NOTE THE `127.0.0.1:` PREFIX — it is the entire security control here.
      #
      #   '5432:5432'            binds every interface, including the EC2
      #                          instance's PUBLIC one. Your database would be
      #                          reachable from the internet, and automated
      #                          scanners find open Postgres ports within
      #                          minutes. Never do this.
      #
      #   '127.0.0.1:5432:5432'  binds the loopback interface only. Reachable
      #                          from processes ON the instance — which
      #                          includes an SSH tunnel — and from nowhere else.
      #
      # This exists so tools like DBeaver can reach the database THROUGH an SSH
      # tunnel. The security group must still keep 5432 closed; the tunnel
      # travels over port 22, encrypted, and needs your private key.
      #
      # The api container does not use this at all — it reaches Postgres over
      # the private compose network by hostname.
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [obtrack]

  # ---------------------------------------------------------------------------
  # Migrations run as a SEPARATE, short-lived service.
  #
  # Two reasons not to run them from the api container's startup command:
  #   1. The runtime image has no Prisma CLI — it was pruned as a dev dependency
  #      to keep the image small. This service uses the `builder` stage, which
  #      still has it.
  #   2. Coupling migrations to app startup means a failed migration presents as
  #      a crash-looping container. As a separate step, a failure is visible and
  #      stops the deploy before the new code goes live.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy
    # The FULL environment, not just DATABASE_URL.
    #
    # This service also runs the seed script, which changes behaviour based on
    # NODE_ENV: in production it demands SEED_ADMIN_EMAIL/PASSWORD and refuses
    # to fall back to a documented default password.
    #
    # When only DATABASE_URL was passed, NODE_ENV was undefined inside this
    # container, so the seed believed it was running in development and created
    # an administrator with the publicly-known default password — on a server
    # exposed to the internet. The guard was intact; the variable it depends on
    # simply never arrived.
    #
    # The lesson: a security check is only as good as the inputs it receives.
    # When behaviour depends on configuration, make sure that configuration
    # actually reaches the process — a guard reading an undefined variable
    # fails open and says nothing.
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    # Runs once and exits. `docker compose up` would otherwise try to restart it.
    restart: 'no'
    networks: [obtrack]

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    # env_file loads secrets at RUN time. They are never part of the image, so
    # they cannot be extracted from it.
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    # Bound to localhost only. nginx reaches it over the compose network; the
    # outside world never talks to Node directly.
    expose:
      - '3000'
    volumes:
      # Receipt images, on a NAMED VOLUME for exactly the same reason the
      # database is: a container's filesystem is destroyed and recreated on
      # every deploy. Without this line, every receipt an office boy uploaded
      # since the last deploy is silently gone — and unlike the database, there
      # is no error, just a download that starts 404ing.
      #
      # The path must match UPLOADS_DIR in .env.production.
      - uploads_data:/app/uploads
    logging:
      # Without a cap, container logs grow until the disk fills — a genuinely
      # common way for small instances to fall over weeks after a deploy.
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks: [obtrack]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks: [obtrack]

volumes:
  postgres_data:
  uploads_data:

networks:
  obtrack:
    driver: bridge
